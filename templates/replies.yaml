templates:
  - name: greeting
    match_any: ["здравствуйте", "привет", "добрый день"]
    response: |
      Здравствуйте! Спасибо за обращение. Подскажите, пожалуйста, по какому объявлению вы пишете и какой вопрос интересует в первую очередь?

  - name: availability
    match_any: ["актуально", "в наличии", "свободно"]
    response: |
      Да, актуально. Можем обсудить детали. Удобно продолжить здесь или позвонить?

  - name: price
    match_any: ["цена", "скидка", "дорог", "стоимость"]
    response: |
      Цена указана в объявлении. Готовы обсудить разумное предложение. Какой бюджет вы рассматриваете?

  - name: location
    match_any: ["где", "самовывоз", "доставка", "адрес"]
    response: |
      Возможен самовывоз и доставка по договоренности. Напишите ваш район, чтобы прикинуть варианты и стоимость доставки.

